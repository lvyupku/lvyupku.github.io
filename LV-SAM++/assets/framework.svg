<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="770" viewBox="0 0 1500 770" role="img" aria-labelledby="title desc">
  <title id="title">LV-SAM++ simplified architecture</title>
  <desc id="desc">Local CNN and SAM ViT features are fused by cross-branch attention and weighted by semantic prompts. PubMedBERT and HSPF support semantic guidance and Grounding DINO box prompts. The SAM decoder produces an LV mask used for EI and ACR.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#667178" /></marker>
